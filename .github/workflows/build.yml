name: build
on:
  push:
    branches:
      - master
    tags: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'

      - name: Update mod_version in gradle.properties
        if: startsWith(github.ref, 'refs/tags/')
        run: sed -i 's/^mod_version=.*/mod_version=${{ github.ref_name }}/' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: build 
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: capture build artifact
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/*
          archive: false

      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: apehum/mc-publish@v1.2
        with:
          modrinth-id: 7FoirOzn
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: |
            emi | depends | *
            XxWD5pD3 | recommends | *
            refined-storage | recommends | *
            refined-storage-emi-integration | recommends | *
          curseforge-id: 1480670
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-name: emi-patternizer-${{ github.ref_name }}
          curseforge-dependencies: |
            emi | depends | *
            applied-energistics-2 | recommends | *
            refined-storage | recommends | *
            refined-storage-emi-integration | recommends | *
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-type: beta
